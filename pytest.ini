[pytest]
# ==========================================================================
# TWO RUN COMMANDS. Run from `backend/`.
#
#   FAST  (default iteration; seconds-to-minutes)
#       python -m pytest -m "not live"
#
#   FULL  (the real gate; pay this once before declaring an item done)
#       python -m pytest
#
# `-m "not live"` is deliberately NOT in addopts. If it were, a bare
# `pytest` would silently stop running the live tests and the full gate
# could not be run without editing this file. Keeping the filter on the
# command line makes the two modes explicit and mutually exclusive.
#
# WHAT BELONGS IN --ignore
# ------------------------
# Only modules that are SCRIPTS, not test modules: pytest collects them
# because they match `*_test.py`, they execute real work at import time,
# and they contain zero test functions. Ignoring a module that HAS tests
# hides coverage, so nothing with tests belongs here -- those are governed
# by the `live` marker instead.
#
# `test_modal_dialog_recovery.py`, `test_phase6_real_windows.py` and
# `test_phase6_text_verification.py` were previously listed here, which
# silently disabled 27 real GUI tests from every run, fast and full. They
# are now governed by `live`: excluded from the fast run, included in the
# full one.
# ==========================================================================
addopts =
    --ignore=test_type_text_verification_live.py
    --ignore=brain/test_brain.py
    --ignore=run_direct_test.py
    --ignore=run_prompt_test.py
    --ignore=run_combined_test.py
    --ignore=_debug_test.py
markers =
    live: requires a real external application, GUI session, browser, or provider. Excluded from the fast run by `-m "not live"`; run alone with `-m live`, or as part of an unfiltered `pytest`.
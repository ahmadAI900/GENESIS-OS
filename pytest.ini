[pytest]
# ==========================================================================
# TWO RUN COMMANDS. Run from `backend/`.
#
#   FAST  (default iteration; seconds-to-minutes)
#       python -m pytest -m "not live"
#
#   FULL  (the real gate; pay this once before declaring an item done)
#       python -m pytest
#
# `-m "not live"` is deliberately NOT in addopts. If it were, a bare
# `pytest` would silently stop running the live tests and the full gate
# could not be run without editing this file. Keeping the filter on the
# command line makes the two modes explicit and mutually exclusive.
#
# WHAT BELONGS IN --ignore
# ------------------------
# Only SCRIPTS, never modules with tests. Collection picks up BOTH
# patterns (pytest's defaults): `test_*.py` AND `*_test.py`. An entry
# here must therefore satisfy all three rules, which
# test_pytest_collection_policy.py enforces on every run:
#   1. the file exists,
#   2. the file is named in this comment with its reason,
#   3. the file defines ZERO test functions -- ignoring a module that
#      HAS tests hides coverage; those are governed by the `live`
#      marker instead.
# All six current entries define zero tests and execute real work at
# import time (module-level side effects), so collection itself would
# run them:
#   test_type_text_verification_live.py (matches test_*.py) --
#       launches notepad.exe and drives pyautogui at module level.
#   brain/test_brain.py (matches test_*.py) --
#       prints a real brain response at module level.
#   run_direct_test.py (matches *_test.py) --
#       load_dotenv() plus a live provider status check at module level.
#   run_prompt_test.py (matches *_test.py) --
#       runs live LLM prompt probes at module level.
#   run_combined_test.py (matches *_test.py) --
#       runs live prompt and 61-phrase E2E probes at module level.
#   _debug_test.py (matches *_test.py) --
#       debug prints at module level.
# Scripts that match neither pattern are kept out of collection by
# naming (script_ prefix), not by --ignore; see
# test_pytest_collection_policy.py::test_every_collected_module_defines_at_least_one_test.
#
# `test_modal_dialog_recovery.py`, `test_phase6_real_windows.py` and
# `test_phase6_text_verification.py` were previously listed here, which
# silently disabled 27 real GUI tests from every run, fast and full. They
# are now governed by `live`: excluded from the fast run, included in the
# full one.
# ==========================================================================
addopts =
    --ignore=test_type_text_verification_live.py
    --ignore=brain/test_brain.py
    --ignore=run_direct_test.py
    --ignore=run_prompt_test.py
    --ignore=run_combined_test.py
    --ignore=_debug_test.py
markers =
    live: requires a real external application, GUI session, browser, or provider. Excluded from the fast run by `-m "not live"`; run alone with `-m live`, or as part of an unfiltered `pytest`.